<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/static/manifest.json" />
  <title>RegIntel RSS & Impact Studio</title>
  <style>
    :root {
      --bg: #0b1120; --card: #1e293b; --border: #334155;
      --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --danger: #ef4444; --ok: #10b981;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; max-width: 1020px; margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    h1 { font-size: 1.25rem; margin: 0; }
    .badge { font-size: 0.75rem; background: #1d4ed8; padding: 4px 8px; border-radius: 6px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); font-size: 0.95rem; margin-bottom: 12px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: #0f172a; color: var(--muted); font-size: 0.8rem; cursor: pointer; user-select: none;
    }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      padding: 12px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; flex: 1; min-width: 180px;
    }
    .btn-primary { background: var(--danger); color: white; }
    .btn-secondary { background: var(--accent); color: white; }
    .btn-save { background: var(--ok); color: #052e16; max-width: 160px; }
    .feed-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
    .feed-item:last-child { border-bottom: none; }
    .feed-item a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    .meta { font-size: 0.78rem; color: var(--muted); margin: 4px 0; }

    /* Clean Report Typography & Tables */
    #reportOutput { line-height: 1.6; font-size: 0.95rem; color: #e2e8f0; }
    .sec-title { font-size: 1.08rem; font-weight: 700; color: #93c5fd; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #334155; }
    .sec-title:first-child { margin-top: 0; }
    .rep-p { margin: 6px 0 10px; }
    .rep-list { margin: 6px 0 12px 20px; padding: 0; }
    .rep-list li { margin-bottom: 6px; }
    .table-wrap { overflow-x: auto; margin: 12px 0 16px; border-radius: 8px; border: 1px solid #475569; }
    table.impact-table { width: 100%; border-collapse: collapse; min-width: 620px; background: #0f172a; }
    table.impact-table th { background: #1e3a8a; color: #f8fafc; text-align: left; padding: 10px 12px; font-size: 0.85rem; border-bottom: 1px solid #475569; }
    table.impact-table td { padding: 10px 12px; font-size: 0.86rem; border-bottom: 1px solid #1e293b; vertical-align: top; }
    table.impact-table tr:nth-child(even) td { background: #131c31; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RegIntel RSS &amp; Impact Studio</h1>
      <div class="meta">Android • Apple iOS/macOS • Microsoft Windows</div>
    </div>
        <div style="display:flex; gap:8px; align-items:center;">
      <button id="installAppBtn" onclick="triggerInstall()" style="min-width:auto; padding:6px 12px; font-size:0.78rem; background:#10b981; color:#052e16;">Install App</button>
      <span class="badge" id="keyStatus">No API Key</span>
    </div>
  </header>

  <div class="card">
    <label>Personal LLM API Configuration (Stored Locally on Your Device)</label>
    <div class="grid">
      <div>
        <label>API Endpoint (OpenAI-Compatible)</label>
        <input type="text" id="apiBase" value="https://velona.in/gateway/v1/inference/run" />
      </div>
      <div>
        <label>Model ID</label>
        <input type="text" id="modelId" value="deepseek/deepseek-v4-flash-0731" />
      </div>
      <div>
        <label>Personal API Key</label>
        <input type="password" id="apiKey" placeholder="Enter personal API key" />
      </div>
    </div>
    <button class="btn-save" onclick="saveConfig()">Save Key Locally</button>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>Select Regulatory Feed Source</label>
        <select id="feedSource"><option value="">Loading feeds...</option></select>
<script>
(function() {
  function populateFeeds() {
    var sel = document.getElementById("feedSource");
    if (!sel) return;
    var base = "";
    try {
      var bEl = document.getElementById("backendUrl");
      var saved = localStorage.getItem("regintel_backend_url") || "http://127.0.0.1:8080";
      base = ((bEl && bEl.value) ? bEl.value : saved).trim().replace(/\/+$/, "");
    } catch (e) { base = "http://127.0.0.1:8080"; }
    fetch((base || "") + "/api/feeds")
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data) {
        var list = Array.isArray(data) ? data : (data.sources || data.feeds || []);
        sel.innerHTML = "";
        if (!list.length) {
          sel.innerHTML = '<option value="">No sources in response</option>';
          return;
        }
        list.forEach(function(src) {
          var label = typeof src === "string" ? src : (src.name || src.title || String(src));
          var opt = document.createElement("option");
          opt.value = label;
          opt.textContent = label;
          sel.appendChild(opt);
        });
      })
      .catch(function(err) {
        sel.innerHTML = '<option value="">Feed err: ' + err.message + '</option>';
      });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", populateFeeds);
  } else {
    populateFeeds();
  }
})();
</script>
      </div>
      <div>
        <label>Impact Report Depth</label>
        <select id="reportDepth">
          <option value="Executive Signal (Concise & Fast)">Executive Signal (Concise &amp; Fast)</option>
          <option value="Standard Impact (Balanced RA & CMC)" selected>Standard Impact (Balanced RA &amp; CMC)</option>
          <option value="Deep Technical & CMC/RA Audit (Granular)">Deep Technical &amp; CMC/RA Audit (Granular)</option>
        </select>
      </div>
    </div>

    <label>Custom RSS / Atom Feed URL (Optional — used if Custom RSS is selected)</label>
    <input type="text" id="customFeedUrl" placeholder="https://example.org/regulatory-feed.xml" />

    <label>Quick Regulatory Keyword Tags (Tap to Filter Before Execution)</label>
    <div class="chips" id="presetChips"></div>

    <label>Open Keyword / Product Entry (comma-separated)</label>
    <input type="text" id="openKeywords" placeholder="e.g., biosimilar, denosumab, CMC, comparability, nitrosamines" />

    <div class="btn-row">
      <button class="btn-secondary" onclick="runPipeline(false)">Fetch Filtered Live Feed</button>
      <button class="btn-primary" onclick="runPipeline(true)">Fetch &amp; Generate AI Impact Report</button>
    </div>
  </div>

  <div class="card" id="feedCard" style="display:none;">
    <h3 style="margin-top:0;">Filtered Live Agency Updates (<span id="feedCount">0</span>)</h3>
    <div id="feedList"></div>
  </div>

  <div class="card" id="reportCard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <h3 style="margin:0;">Regulatory Impact Analysis <span class="meta" id="streamStatus" style="display:inline; margin-left:8px;"></span></h3>
      <div style="display:flex; gap:8px;">
        <button style="max-width:140px; min-width:110px; padding:8px; background:#334155; color:#fff;" onclick="downloadMd()">Download .md</button>
        <button style="max-width:150px; min-width:120px; padding:8px; background:#2563eb; color:#fff;" onclick="downloadDocx()">Download .docx</button>
      </div>
    </div>
    <hr style="border-color:var(--border);" />
    <div id="reportOutput"></div>
  </div>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");

    const PRESETS = ["biosimilar", "interchangeability", "CMC", "comparability", "BLA", "MAA", "ADC", "gene therapy", "nitrosamines", "stability", "GMP", "labeling"];
    const selectedPresets = new Set();
    let latestItems = [];
    let latestMarkdown = "";

    function stripNoiseTokens(str) {
      return (str || "")
        .replace(/\*{2,}/g, "")
        .replace(/^#{1,6}\s*/gm, "")
        .replace(/^\s*[-*_]{3,}\s*$/gm, "");
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatInline(s) {
      let out = escapeHtml(stripNoiseTokens(s));
      out = out.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
      out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:#60a5fa;">$1</a>');
      return out;
    }

    function renderFormattedReport(rawText) {
      const lines = (rawText || "").split("\n");
      let html = "";
      let i = 0;
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) { html += "</ul>"; inUl = false; }
        if (inOl) { html += "</ol>"; inOl = false; }
      };

      while (i < lines.length) {
        const trimmed = lines[i].trim();

        if (!trimmed || /^[-*_]{3,}$/.test(trimmed)) {
          closeLists();
          i++;
          continue;
        }

        // Markdown table block -> clean HTML table
        if (trimmed.startsWith("|") && trimmed.indexOf("|", 1) !== -1) {
          closeLists();
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            const rTrim = lines[i].trim().replace(/^\|+|\|+$/g, "");
            const cells = rTrim.split("|").map(c => c.trim());
            const isSep = cells.every(c => /^[-:\s]+$/.test(c));
            if (!isSep) rows.push(cells);
            i++;
          }
          if (rows.length > 0) {
            const cols = Math.max(...rows.map(r => r.length));
            html += '<div class="table-wrap"><table class="impact-table"><thead><tr>';
            for (let c = 0; c < cols; c++) {
              html += `<th>${formatInline(rows[0][c] || "")}</th>`;
            }
            html += "</tr></thead><tbody>";
            for (let r = 1; r < rows.length; r++) {
              html += "<tr>";
              for (let c = 0; c < cols; c++) {
                html += `<td>${formatInline(rows[r][c] || "")}</td>`;
              }
              html += "</tr>";
            }
            html += "</tbody></table></div>";
          }
          continue;
        }

        // Heading lines (even if raw # or ## appeared in stream)
        if (/^#{1,6}\s+/.test(trimmed) || /^(1\.|2\.|3\.|4\.)\s+(Executive Signal Summary|Regulatory Impact Table|Technical & CMC\/RA Takeaways|Actionable Checklist)/i.test(stripNoiseTokens(trimmed))) {
          closeLists();
          html += `<div class="sec-title">${formatInline(trimmed)}</div>`;
          i++;
          continue;
        }

        // Bullet items
        if (/^[-*]\s+/.test(trimmed)) {
          if (inOl) { html += "</ol>"; inOl = false; }
          if (!inUl) { html += '<ul class="rep-list">'; inUl = true; }
          html += `<li>${formatInline(trimmed.replace(/^[-*]\s+/, ""))}</li>`;
          i++;
          continue;
        }

        // Numbered items
        if (/^\d+\.\s+/.test(trimmed)) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (!inOl) { html += '<ol class="rep-list">'; inOl = true; }
          html += `<li>${formatInline(trimmed.replace(/^\d+\.\s+/, ""))}</li>`;
          i++;
          continue;
        }

        closeLists();
        html += `<p class="rep-p">${formatInline(trimmed)}</p>`;
        i++;
      }

      closeLists();
      return html;
    }

    function initUI() {
      const chipBox = document.getElementById("presetChips");
      PRESETS.forEach(tag => {
        const el = document.createElement("span");
        el.className = "chip";
        el.textContent = tag;
        el.onclick = () => {
          if (selectedPresets.has(tag)) { selectedPresets.delete(tag); el.classList.remove("active"); }
          else { selectedPresets.add(tag); el.classList.add("active"); }
        };
        chipBox.appendChild(el);
      });

      let savedBase = localStorage.getItem("reg_api_base") || "https://velona.in/gateway/v1/inference/run";
      if (savedBase.includes("velona.in") && !savedBase.includes("/gateway/v1/inference/run")) {
        savedBase = "https://velona.in/gateway/v1/inference/run";
        localStorage.setItem("reg_api_base", savedBase);
      }
      document.getElementById("apiBase").value = savedBase;
      document.getElementById("modelId").value = localStorage.getItem("reg_model_id") || "deepseek/deepseek-v4-flash-0731";
      const savedKey = localStorage.getItem("reg_api_key") || "";
      document.getElementById("apiKey").value = savedKey;
      updateKeyBadge(savedKey);

      fetch(apiUrl("/api/feeds").then(r => r.json()).then(data => {
        const sel = document.getElementById("feedSource");
        (data.sources || []).forEach(src => {
          const opt = document.createElement("option");
          opt.value = src; opt.textContent = src;
          sel.appendChild(opt);
        });
      });
    }

    function updateKeyBadge(k) {
      const b = document.getElementById("keyStatus");
      b.textContent = k ? "Personal Key Ready" : "No API Key";
      b.style.background = k ? "#065f46" : "#991b1b";
    }

    function saveConfig() {
      const base = document.getElementById("apiBase").value.trim();
      const model = document.getElementById("modelId").value.trim();
      const key = document.getElementById("apiKey").value.trim();
      localStorage.setItem("reg_api_base", base);
      localStorage.setItem("reg_model_id", model);
      localStorage.setItem("reg_api_key", key);
      updateKeyBadge(key);
      alert("API configuration saved securely in local device storage.");
    }

    async function runPipeline(withAI) {
    const sourceEl = document.getElementById("feedSource");
    const source = sourceEl ? sourceEl.value : "";
    const openEl = document.getElementById("openKeywords");
    const openTerms = (openEl ? openEl.value : "").split(",").map(s => s.trim()).filter(Boolean);
    const combined = [...new Set([...selectedPresets, ...openTerms])].join(",");

    const feedCard = document.getElementById("feedCard");
    const feedList = document.getElementById("feedList");
    if (feedCard) feedCard.style.display = "block";
    if (feedList) feedList.innerHTML = "<div class='meta'>Fetching live agency feed...</div>";

    try {
      if (!source) {
        if (feedList) feedList.innerHTML = "<div class='meta'>Please select a feed source first.</div>";
        return;
      }
      const customEl = document.getElementById("customFeedUrl");
      const customUrl = customEl ? customEl.value.trim() : "";
      const path = `/api/fetch?source=${encodeURIComponent(source)}&keywords=${encodeURIComponent(combined)}&custom_url=${encodeURIComponent(customUrl)}`;
      const url = (typeof apiUrl === "function") ? apiUrl(path) : path;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      latestItems = data.items || [];
      const countEl = document.getElementById("feedCount");
      if (countEl) countEl.textContent = latestItems.length;

      if (!latestItems.length) {
        if (feedList) feedList.innerHTML = `<div class='meta'>${escapeHtml(data.note || data.error || "No updates matched your keyword filter.")}</div>`;
        return;
      }

      if (feedList) {
        feedList.innerHTML = latestItems.map((it, i) => `
          <div class="feed-item">
            <div><a href="${it.link}" target="_blank">${i + 1}. ${escapeHtml(it.title)}</a></div>
            <div class="meta">${escapeHtml(it.published)}</div>
            <div style="font-size:0.88rem; color:#cbd5e1;">${escapeHtml(it.summary)}</div>
          </div>
        `).join("");
      }
    } catch (err) {
      if (feedList) feedList.innerHTML = `<div class='meta'>Fetch error: ${escapeHtml(err.message)}</div>`;
    }

      if (!withAI) return;

      const apiKey = document.getElementById("apiKey").value.trim();
      const apiBase = document.getElementById("apiBase").value.trim();
      const modelId = document.getElementById("modelId").value.trim();
      const depth = document.getElementById("reportDepth").value;

      if (!apiKey) {
        alert("Please enter and save your Personal API Key first.");
        return;
      }

      const reportCard = document.getElementById("reportCard");
      const reportOut = document.getElementById("reportOutput");
      const streamStatus = document.getElementById("streamStatus");
      reportCard.style.display = "block";
      streamStatus.textContent = "(Streaming live...)";
      latestMarkdown = "";
      reportOut.innerHTML = `<div class="meta">Connecting to ${escapeHtml(modelId)}...</div>`;

      const digest = latestItems.slice(0, 10).map((it, i) =>
        `Item ${i + 1}: ${it.title}\nPublished: ${it.published}\nURL: ${it.link}\nSummary: ${it.summary}`
      ).join("\n\n");

      const prompt = `Analyze these regulatory updates from ${source} at depth level: "${depth}".
Keyword Filter: ${combined || "None (Top Recent Updates)"}.
Formatting rules:
- Do NOT use markdown hash headings (#, ##, ###), horizontal rules (--- or ***), or bold asterisks (**).
- Use clean section headers and standard pipe tables (| Col 1 | Col 2 | ...) for structured comparisons.
Provide:
1. Executive Signal Summary
2. Regulatory Impact Table (Item | Modality | Compliance Shift | Action & Urgency)
3. Technical & CMC/RA Takeaways tailored to "${depth}"
4. Actionable Checklist with exact URLs.

SOURCE ITEMS:
${digest}`;

      try {
        const aiRes = await fetch(apiUrl("/api/analyze-stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_base: apiBase, api_key: apiKey, model: modelId, prompt: prompt })
        });

        if (!aiRes.ok || !aiRes.body) {
          streamStatus.textContent = "(Error)";
          reportOut.innerHTML = `<div class="meta">Stream HTTP error: ${aiRes.status}</div>`;
          return;
        }

        const reader = aiRes.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";

          for (const pkt of parts) {
            const line = pkt.trim();
            if (!line.startsWith("data:")) continue;
            const payloadStr = line.slice(5).trim();
            if (payloadStr === "[DONE]") {
              streamStatus.textContent = "(Complete)";
              break;
            }
            try {
              const obj = JSON.parse(payloadStr);
              if (obj.error) {
                latestMarkdown = "Error: " + obj.error;
                reportOut.innerHTML = `<div class="meta">${escapeHtml(latestMarkdown)}</div>`;
                streamStatus.textContent = "(Error)";
                return;
              }
              if (obj.delta) {
                latestMarkdown += obj.delta;
                reportOut.innerHTML = renderFormattedReport(latestMarkdown);
              }
            } catch (_) {}
          }
        }

        latestMarkdown = stripNoiseTokens(latestMarkdown);
        reportOut.innerHTML = renderFormattedReport(latestMarkdown);
        if (streamStatus.textContent === "(Streaming live...)") {
          streamStatus.textContent = "(Complete)";
        }
      } catch (err) {
        streamStatus.textContent = "(Error)";
        reportOut.innerHTML = `<div class="meta">Stream Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    function downloadMd() {
      const blob = new Blob([stripNoiseTokens(latestMarkdown)], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `RegIntel_Impact_${new Date().toISOString().slice(0,10)}.md`;
      a.click();
    }

    async function downloadDocx() {
      if (!latestMarkdown) {
        alert("Generate an Impact Report first.");
        return;
      }
      const source = document.getElementById("feedSource").value;
      const depth = document.getElementById("reportDepth").value;
      const res = await fetch(apiUrl("/api/export-docx", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: "Regulatory Intelligence Impact Analysis",
          source: source,
          depth: depth,
          content: stripNoiseTokens(latestMarkdown)
        })
      });
      if (!res.ok) {
        alert("DOCX export failed.");
        return;
      }
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `RegIntel_Impact_${new Date().toISOString().slice(0,10)}.docx`;
      a.click();
    }


    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    async function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        return;
      }
      alert(
        "Install RegIntel Studio as a Native App:\n\n" +
        "• Android (Chrome): Tap Menu (⋮) -> Add to Home screen -> Install\n" +
        "• Apple iOS/iPadOS (Safari): Tap Share -> Add to Home Screen\n" +
        "• Apple macOS (Safari): File -> Add to Dock\n" +
        "• Windows (Edge/Chrome): Address Bar -> Install App (or Menu -> Apps -> Install)"
      );
    }


    function getBackendBase() {
      const el = document.getElementById("backendUrl");
      const saved = localStorage.getItem("regintel_backend_url") || "http://127.0.0.1:8080";
      if (el && !el.value) el.value = saved;
      const raw = (el && el.value ? el.value : saved).trim().replace(/\/+$/, "");
      if (raw) localStorage.setItem("regintel_backend_url", raw);
      return raw;
    }
    function apiUrl(path) {
      const base = getBackendBase();
      return base ? base + path : path;
    }

    initUI();
  </script>

<script>
(function() {
  function bindKeyAck() {
    var inp = document.getElementById("apiKey");
    var badge = document.getElementById("keyStatus");
    if (!inp) return;
    var ack = document.getElementById("keyAckMsg");
    if (!ack && inp.parentNode) {
      ack = document.createElement("div");
      ack.id = "keyAckMsg";
      ack.style.fontSize = "0.82rem";
      ack.style.marginTop = "4px";
      ack.style.color = "#94a3b8";
      inp.parentNode.appendChild(ack);
    }
    function refresh() {
      var val = (inp.value || "").trim();
      try { localStorage.setItem("reg_api_key", val); } catch (e) {}
      if (typeof updateKeyBadge === "function") {
        try { updateKeyBadge(val); } catch (e) {}
      }
      if (badge) {
        badge.textContent = val ? "Personal Key Ready" : "No API Key";
        badge.style.background = val ? "#065f46" : "#991b1b";
      }
      if (ack) {

<script>
/* DIRECT_FETCH_BIND */
(function() {
  function getBase() {
    try {
      var bEl = document.getElementById("backendUrl");
      var saved = localStorage.getItem("regintel_backend_url") || "";
      var v = ((bEl && bEl.value) ? bEl.value : saved).trim().replace(/\/+$/, "");
      if (v) return v;
    } catch (e) {}
    return (location.protocol === "http:" || location.protocol === "https:") ? "" : "http://127.0.0.1:8080";
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function formatInlineClean(txt) {
  var s = String(txt || "").replace(/\*\*/g, "").replace(/__/g, "");
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}

function renderMd(md) {
  var raw = String(md || "").replace(/\r\n/g, "\n");
  var lines = raw.split("\n");
  var out = [];
  var i = 0;
  var tableStyle = "width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;";
  var thStyle = "border:1px solid #334155;padding:7px 9px;text-align:left;background:#1e293b;color:#f8fafc;font-weight:600;";
  var tdStyle = "border:1px solid #334155;padding:7px 9px;text-align:left;vertical-align:top;";

  while (i < lines.length) {
    var line = lines[i].trim();
    if (!line) {
      i++;
      continue;
    }
    if (line.indexOf("|") !== -1 && i + 1 < lines.length && /^\|?\s*:?-{2,}:?(\s*\|\s*:?-{2,}:?)+\s*\|?$/.test(lines[i + 1].trim())) {
      var headers = line.replace(/^\||\|$/g, "").split("|").map(function(c) { return formatInlineClean(c.trim()); });
      i += 2;
      var rowsHtml = "";
      while (i < lines.length && lines[i].trim().indexOf("|") !== -1) {
        var rowLine = lines[i].trim();
        if (/^\|?\s*:?-{2,}:?(\s*\|\s*:?-{2,}:?)+\s*\|?$/.test(rowLine)) {
          i++;
          continue;
        }
        var cells = rowLine.replace(/^\||\|$/g, "").split("|").map(function(c) { return formatInlineClean(c.trim()); });
        rowsHtml += "<tr>" + cells.map(function(c) { return "<td style='" + tdStyle + "'>" + c + "</td>"; }).join("") + "</tr>";
        i++;
      }
      out.push("<div style='overflow-x:auto;'><table style='" + tableStyle + "'><thead><tr>" +
        headers.map(function(h) { return "<th style='" + thStyle + "'>" + h + "</th>"; }).join("") +
        "</tr></thead><tbody>" + rowsHtml + "</tbody></table></div>");
      continue;
    }

    var headingMatch = line.match(/^#{1,6}\s+(.*)$/);
    if (headingMatch) {
      var hText = headingMatch[1].replace(/\*\*/g, "").trim();
      out.push("<div style='margin:14px 0 6px;font-weight:700;font-size:15px;color:#93c5fd;border-bottom:1px solid #334155;padding-bottom:4px;'>" + formatInlineClean(hText) + "</div>");
      i++;
      continue;
    }

    var bulletMatch = line.match(/^[-*•]\s+(.*)$/);
    if (bulletMatch) {
      var items = [];
      while (i < lines.length && lines[i].trim().match(/^[-*•]\s+(.*)$/)) {
        var bm = lines[i].trim().match(/^[-*•]\s+(.*)$/);
        items.push("<li style='margin:4px 0;'>" + formatInlineClean(bm[1]) + "</li>");
        i++;
      }
      out.push("<ul style='margin:6px 0 10px 18px;padding:0;'>" + items.join("") + "</ul>");
      continue;
    }

    var paraLines = [];
    while (i < lines.length) {
      var cur = lines[i].trim();
      if (!cur || cur.indexOf("|") !== -1 || /^#{1,6}\s+/.test(cur) || /^[-*•]\s+/.test(cur)) {
        break;
      }
      paraLines.push(cur.replace(/\*\*/g, ""));
      i++;
    }
    if (paraLines.length) {
      out.push("<p style='margin:6px 0;line-height:1.5;'>" + formatInlineClean(paraLines.join(" ")) + "</p>");
    }
  }
  return out.join("") || "<div class='meta'>No formatted content returned.</div>";
}

  async function doPipeline(withAI, ev) {
    if (ev) { ev.preventDefault(); ev.stopImmediatePropagation(); }
    var srcEl = document.getElementById("feedSource");
    var source = srcEl ? (srcEl.value || "").trim() : "";
    var kwEl = document.getElementById("openKeywords");
    var keywords = kwEl ? (kwEl.value || "").trim() : "";
    var custEl = document.getElementById("customFeedUrl");
    var customUrl = custEl ? (custEl.value || "").trim() : "";
    var card = document.getElementById("feedCard");
    var list = document.getElementById("feedList");
    var cnt = document.getElementById("feedCount");

    if (card) card.style.display = "block";
    if (!source) {
      if (list) list.innerHTML = "<div class='meta'>Select a feed source first.</div>";
      return;
    }
    if (list) list.innerHTML = "<div class='meta'>Fetching: " + esc(source) + "...</div>";

    var url = getBase() + "/api/fetch?source=" + encodeURIComponent(source)
      + "&keywords=" + encodeURIComponent(keywords)
      + "&custom_url=" + encodeURIComponent(customUrl);

    var items = [];
    try {
      var res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      items = data.items || [];
      window.latestItems = items;
      if (cnt) cnt.textContent = items.length;
      if (!items.length) {
        if (list) list.innerHTML = "<div class='meta'>" + esc(data.note || data.error || "0 items returned.") + "</div>";
        return;
      }
      if (list) {
        list.innerHTML = items.map(function(it, i) {
          return "<div class='feed-item'>"
            + "<div><a href='" + esc(it.link) + "' target='_blank'>" + (i + 1) + ". " + esc(it.title) + "</a></div>"
            + "<div class='meta'>" + esc(it.published) + "</div>"
            + "<div style='font-size:0.88rem;color:#cbd5e1;'>" + esc(it.summary) + "</div>"
            + "</div>";
        }).join("");
      }
    } catch (err) {
      if (list) list.innerHTML = "<div class='meta' style='color:#fca5a5;word-break:break-word;'>Fetch failed: " + esc((err && err.message) || String(err)) + " (" + esc(url) + ")</div>";
      return;
    }

    if (!withAI) return;

    var apiKey = ((document.getElementById("apiKey") || {}).value || localStorage.getItem("reg_api_key") || "").trim();
    var apiBase = ((document.getElementById("apiBase") || {}).value || "https://velona.in/gateway/v1/inference/run").trim();
    var modelId = ((document.getElementById("modelId") || {}).value || "").trim();
    var depth = ((document.getElementById("reportDepth") || {}).value || "Executive Summary").trim();

    var reportCard = document.getElementById("reportCard");
    var reportOut = document.getElementById("reportOutput");
    var streamStatus = document.getElementById("streamStatus");
    if (reportCard) reportCard.style.display = "block";

    if (!apiKey) {
      if (reportOut) reportOut.innerHTML = "<div class='meta'>Please enter your Personal API Key first.</div>";
      return;
    }

    if (streamStatus) streamStatus.textContent = "(Streaming live...)";
    if (reportOut) reportOut.innerHTML = "<div class='meta'>Connecting to " + esc(modelId || "AI model") + "...</div>";

    var digest = items.slice(0, 10).map(function(it, i) {
      return (i + 1) + ". " + it.title + " (" + it.published + ")\nURL: " + it.link + "\nSummary: " + it.summary;
    }).join("\n\n");

    var prompt = "Analyze these regulatory updates from " + source + " at depth level: " + depth + ".
"
    + "Keyword Filter: " + (keywords || "None (Top Recent Updates)") + ".
"
    + "Formatting rules: Do NOT use ## headings or ** bold markdown markers anywhere. Use clean plain-text section labels followed by a colon and use structured Markdown pipe tables (| ... |) for comparisons, impacts, and action plans.
"
    + "Provide:
"
    + "Executive Signal Summary: concise overview.
"
    + "Regulatory Impact Matrix:
"
    + "| Update / Authority | Modality & Scope | Regulatory & CMC/Clinical Impact | Priority Action & Timeline |
"
    + "| --- | --- | --- | --- |
"
    + "Technical & CMC/RA Takeaways tailored to " + depth + ":
"
    + "| Focus Area | Key Requirement | Risk / Compliance Impact | Reference URL |
"
    + "| --- | --- | --- | --- |
"
    + "Updates:
" + digest;

    try {
      var aiRes = await fetch(getBase() + "/api/analyze-stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          api_base: apiBase,
          api_key: apiKey,
          model: modelId,
          prompt: prompt
        })
      });
      if (!aiRes.ok || !aiRes.body) {
        var errTxt = await aiRes.text().catch(function() { return ""; });
        throw new Error("HTTP " + aiRes.status + (errTxt ? ": " + errTxt : ""));
      }
      var reader = aiRes.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      var fullText = "";
      var doneStream = false;

      while (!doneStream) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (var i = 0; i < parts.length; i++) {
          var line = parts[i].trim();
          if (!line.startsWith("data:")) continue;
          var payloadStr = line.slice(5).trim();
          if (payloadStr === "[DONE]") {
            doneStream = true;
            break;
          }
          try {
            var obj = JSON.parse(payloadStr);
            if (obj.error) {
              throw new Error(obj.error);
            }
            if (obj.delta) {
              fullText += obj.delta;
              window.latestMarkdown = fullText;
              if (reportOut) { reportOut.innerHTML = renderMd(fullText); }
            }
          } catch (parseErr) {
            if (parseErr && parseErr.message && parseErr.message.indexOf("JSON") === -1) {
              throw parseErr;
            }
          }
        }
      }
      if (!fullText && buffer.trim()) {
        fullText = buffer.trim();
        window.latestMarkdown = fullText;
        if (reportOut) { reportOut.innerHTML = renderMd(fullText); }
      }
      if (streamStatus) streamStatus.textContent = "(Complete)";
    } catch (err) {
      if (streamStatus) streamStatus.textContent = "(Error)";
      if (reportOut) reportOut.innerHTML = "<div class='meta'>AI Report Error: " + esc(err.message) + "</div>";
    }
  }

  function bindButtons() {
    var btns = Array.prototype.slice.call(document.querySelectorAll("button"));
    btns.forEach(function(b) {
      var txt = (b.textContent || "").toLowerCase();
      var oc = (b.getAttribute("onclick") || "");
      if (oc.indexOf("runPipeline(false)") !== -1 || (txt.indexOf("fetch") !== -1 && txt.indexOf("ai") === -1 && txt.indexOf("report") === -1)) {
        b.removeAttribute("onclick");
        b.addEventListener("click", function(ev) { doPipeline(false, ev); }, true);
      } else if (oc.indexOf("runPipeline(true)") !== -1 || (txt.indexOf("ai") !== -1 || txt.indexOf("report") !== -1)) {
        b.removeAttribute("onclick");
        b.addEventListener("click", function(ev) { doPipeline(true, ev); }, true);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindButtons);
  } else {
    bindButtons();
  }
})();
</script>

      + "Updates:\n" + digest;

    try {
      var res = await fetch("/api/analyze-stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          api_base: apiBase,
          api_key: apiKey,
          model: modelId,
          prompt: prompt
        })
      });
      if (!res.ok || !res.body) {
        var errTxt = await res.text().catch(function() { return ""; });
        throw new Error("Stream HTTP " + res.status + (errTxt ? ": " + errTxt : ""));
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      var fullText = "";
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var parts = buf.split("\n\n");
        buf = parts.pop() || "";
        for (var i = 0; i < parts.length; i++) {
          var lines = parts[i].split("\n");
          for (var j = 0; j < lines.length; j++) {
            var line = lines[j].trim();
            if (!line.startsWith("data:")) continue;
            var payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
            try {
              var obj = JSON.parse(payload);
              if (obj.error) throw new Error(obj.error);
              var delta = obj.delta || (obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content) || "";
              if (delta) {
                fullText += delta;
                window.latestReportMd = fullText;
                if (reportOut) {
                  reportOut.innerHTML = (typeof renderMd === "function") ? renderMd(fullText) : ("<pre style='white-space:pre-wrap;'>" + escR(fullText) + "</pre>");
                }
              }
            } catch (pe) {
              if (pe.message && pe.message.indexOf("JSON") === -1) throw pe;
            }
          }
        }
      }
      if (!fullText && buf.trim()) {
        fullText = buf.trim();
        window.latestReportMd = fullText;
        if (reportOut) {
          reportOut.innerHTML = (typeof renderMd === "function") ? renderMd(fullText) : ("<pre style='white-space:pre-wrap;'>" + escR(fullText) + "</pre>");
        }
      }
      if (streamStatus) streamStatus.textContent = "Complete";
    } catch (err) {
      if (streamStatus) streamStatus.textContent = "Error";
      if (reportOut) reportOut.innerHTML = "<div class='meta' style='color:#fca5a5;'>AI Impact Report error: " + escR(err.message) + "</div>";
    }
  }

  function attachAIButton() {
    var btns = Array.prototype.slice.call(document.querySelectorAll("button"));
    btns.forEach(function(btn) {
      var txt = (btn.textContent || "").toLowerCase();
      if (txt.indexOf("ai impact report") !== -1 || txt.indexOf("generate") !== -1) {
        btn.removeAttribute("onclick");
        btn.addEventListener("click", function(ev) {
          runAIReportDirect(ev).catch(function(err) {
            var ro = document.getElementById("reportOutput") || document.getElementById("reportOut");
            if (ro) ro.innerHTML = "<div class='meta' style='color:#fca5a5;'>AI Report error: " + escR(err.message) + "</div>";
          });
        }, true);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", attachAIButton);
  } else {
    attachAIButton();
  }
})();
</script>

<!-- LIVE_TABLE_NO_MD_FIX -->
<script>
(function() {
  function escT(s) {
    return String(s || "").replace(/[&<>"']/g, function(c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function cleanPlain(s) {
    return String(s || "")
      .replace(/^#{1,6}\s*/gm, "")
      .replace(/\*\*/g, "")
      .trim();
  }

  window.renderMd = function(rawText) {
    var txt = cleanPlain(rawText);
    if (!txt) return "<div class='meta'>Waiting for stream tokens...</div>";
    var lines = txt.split(/\r?\n/);
    var out = [];
    var i = 0;

    var tblStyle = "width:100%;border-collapse:collapse;margin:10px 0;font-size:0.88em;";
    var thStyle = "border:1px solid #334155;padding:7px 9px;background:#1e293b;color:#e2e8f0;text-align:left;";
    var tdStyle = "border:1px solid #334155;padding:7px 9px;vertical-align:top;color:#cbd5e1;";

    while (i < lines.length) {
      var line = lines[i].trim();
      if (!line) {
        i++;
        continue;
      }

      if (line.indexOf("|") !== -1) {
        var rows = [];
        while (i < lines.length && lines[i].trim().indexOf("|") !== -1) {
          var rowStr = lines[i].trim().replace(/^\|+|\|+$/g, "");
          var isSep = /^[\s:\-|]+$/.test(rowStr) && rowStr.indexOf("-") !== -1;
          if (!isSep) {
            var cells = rowStr.split("|").map(function(c) { return escT(cleanPlain(c)); });
            rows.push(cells);
          }
          i++;
        }
        if (rows.length > 0) {
          var headers = rows[0];
          var bodyRows = rows.slice(1);
          var thead = "<thead><tr>" + headers.map(function(h) {
            return "<th style='" + thStyle + "'>" + h + "</th>";
          }).join("") + "</tr></thead>";
          var tbody = "<tbody>" + bodyRows.map(function(r) {
            return "<tr>" + r.map(function(c) {
              return "<td style='" + tdStyle + "'>" + c + "</td>";
            }).join("") + "</tr>";
          }).join("") + "</tbody>";
          out.push("<div style='overflow-x:auto;'><table style='" + tblStyle + "'>" + thead + tbody + "</table></div>");
        }
        continue;
      }

      if (/^[-*•]\s+/.test(line)) {
        var bullets = [];
        while (i < lines.length && /^[-*•]\s+/.test(lines[i].trim())) {
          bullets.push("<li style='margin:4px 0;'>" + escT(cleanPlain(lines[i].trim().replace(/^[-*•]\s+/, ""))) + "</li>");
          i++;
        }
        out.push("<ul style='margin:6px 0 10px 18px;padding:0;'>" + bullets.join("") + "</ul>");
        continue;
      }

      var colonIdx = line.indexOf(":");
      if (colonIdx > 0 && colonIdx < 65 && line.indexOf("http") !== 0) {
        var label = escT(cleanPlain(line.slice(0, colonIdx)));
        var rest = escT(cleanPlain(line.slice(colonIdx + 1)));
        out.push("<div style='margin:10px 0 4px;font-weight:700;color:#93c5fd;'>" + label + (rest ? ":" : ":") + "</div>"
          + (rest ? "<p style='margin:4px 0 8px;line-height:1.5;'>" + rest + "</p>" : ""));
        i++;
        continue;
      }

      out.push("<p style='margin:6px 0;line-height:1.5;'>" + escT(cleanPlain(line)) + "</p>");
      i++;
    }

    return out.join("") || "<div class='meta'>No content rendered.</div>";
  };

  var origFetch = window.fetch;
  window.fetch = async function(input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("/api/analyze-stream") !== -1 && init && typeof init.body === "string") {
      try {
        var payload = JSON.parse(init.body);
        if (typeof payload.prompt === "string") {
          var extraRule = "\nSTRICT OUTPUT FORMAT:\n"
            + "- NEVER use ## or ** anywhere in your response.\n"
            + "- Present structured findings using Markdown pipe tables (| Col 1 | Col 2 | ... |) with a header separator row (| --- | --- |).\n"
            + "- Use plain text section titles ending in a colon (e.g. Executive Signal Summary:).\n";
          if (payload.prompt.indexOf("NEVER use ## or **") === -1) {
            payload.prompt = extraRule + payload.prompt;
            init = Object.assign({}, init, { body: JSON.stringify(payload) });
          }
        }
      } catch (e) {}
    }
    return origFetch.apply(this, arguments);
  };
})();
</script>

<!-- DOCX_SYNC_FIX -->
<script>
(function() {
  function syncMarkdownVars() {
    if (typeof window.latestReportMd === "string" && window.latestReportMd) {
      window.latestMarkdown = window.latestReportMd;
      try { latestMarkdown = window.latestReportMd; } catch (e) {}
    }
  }

  var origRenderMd = window.renderMd;
  if (typeof origRenderMd === "function" && !origRenderMd._docxWrapped) {
    var wrapped = function(txt) {
      if (typeof txt === "string" && txt.trim()) {
        window.latestReportMd = txt;
        window.latestMarkdown = txt;
        try { latestMarkdown = txt; } catch (e) {}
      }
      return origRenderMd.apply(this, arguments);
    };
    wrapped._docxWrapped = true;
    window.renderMd = wrapped;
  }

  function cleanDocxText(s) {
    return String(s || "")
      .replace(/^#{1,6}\s*/gm, "")
      .replace(/\*\*/g, "")
      .trim();
  }

  async function runDocxDownload(ev) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    syncMarkdownVars();
    var outEl = document.getElementById("reportOutput") || document.getElementById("reportOut");
    var raw = window.latestMarkdown || window.latestReportMd || (outEl ? (outEl.innerText || outEl.textContent || "") : "");
    var content = cleanDocxText(raw);
    if (!content) {
      alert("Generate an Impact Report first.");
      return;
    }
    var srcEl = document.getElementById("feedSource");
    var depthEl = document.getElementById("reportDepth");
    var source = srcEl ? (srcEl.value || "") : "";
    var depth = depthEl ? (depthEl.value || "") : "";
    var base = (typeof getBase === "function") ? getBase() : ((typeof apiUrl === "function") ? apiUrl("").replace(/\/+$/, "") : "");

    try {
      var res = await fetch(base + "/api/export-docx", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: "Regulatory Intelligence Impact Analysis",
          source: source,
          depth: depth,
          content: content
        })
      });
      if (!res.ok) {
        var errTxt = await res.text().catch(function() { return ""; });
        throw new Error("HTTP " + res.status + (errTxt ? " - " + errTxt : ""));
      }
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "RegIntel_Impact_" + new Date().toISOString().slice(0, 10) + ".docx";
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        URL.revokeObjectURL(url);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 1500);
    } catch (err) {
      alert("DOCX export failed: " + err.message);
    }
  }

  window.downloadDocx = runDocxDownload;

  function bindDocxButtons() {
    var btns = Array.prototype.slice.call(document.querySelectorAll("button, a"));
    btns.forEach(function(btn) {
      var oc = (btn.getAttribute("onclick") || "").toLowerCase();
      var txt = (btn.textContent || "").toLowerCase();
      if (oc.indexOf("downloaddocx") !== -1 || txt.indexOf("docx") !== -1) {
        if (btn.dataset.docxSyncBound) return;
        btn.dataset.docxSyncBound = "1";
        btn.removeAttribute("onclick");
        btn.addEventListener("click", runDocxDownload, true);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bindDocxButtons);
  } else {
    bindDocxButtons();
  }
})();
</script>

<!-- REPORT_DATETIME_FIX -->
<script>
(function() {
  function formatNowStamp() {
    var d = new Date();
    var pad = function(n) { return n < 10 ? "0" + n : String(n); };
    var dateStr = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    var timeStr = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    var tzName = "";
    try {
      tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    } catch (e) {}
    return dateStr + " " + timeStr + (tzName ? " (" + tzName + ")" : "");
  }

  window.getReportTimestamp = formatNowStamp;

  var origFetch = window.fetch;
  window.fetch = async function(input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("/api/analyze-stream") !== -1 && init && typeof init.body === "string") {
      try {
        var payload = JSON.parse(init.body);
        if (typeof payload.prompt === "string") {
          var stamp = formatNowStamp();
          var dtRule = "\nDATE & TIME REQUIREMENTS:\n"
            + "- Report Generated At: " + stamp + "\n"
            + "- Include a Report Metadata / Date-Time line near the top showing when the report was generated (" + stamp + ").\n"
            + "- Include a Date / Time column or field in your tables and summaries showing each regulatory update's publication date/time (or 'Not specified in feed' if absent).\n"
            + "- Keep formatting plain text with colon section headers and Markdown pipe tables; do NOT use ## or **.\n";
          if (payload.prompt.indexOf("DATE & TIME REQUIREMENTS:") === -1) {
            var enrichedItems = Array.isArray(window.latestFeedItems) ? window.latestFeedItems.slice(0, 10) : [];
            var dtDigest = enrichedItems.map(function(it, idx) {
              return (idx + 1) + ". " + (it.title || "")
                + " | Published Date/Time: " + (it.published || it.pubDate || it.updated || "Not specified in feed")
                + " | URL: " + (it.link || "");
            }).join("\n");
            payload.prompt = dtRule + payload.prompt
              + (dtDigest ? "\nFeed Item Timestamps:\n" + dtDigest : "");
            init = Object.assign({}, init, { body: JSON.stringify(payload) });
          }
        }
      } catch (e) {}
    }
    return origFetch.apply(this, arguments);
  };

  var prevRender = window.renderMd;
  if (typeof prevRender === "function" && !prevRender._dtWrapped) {
    var wrappedRender = function(rawText) {
      var stamp = formatNowStamp();
      var headerLine = "Report Generated: " + stamp + "\n\n";
      var bodyText = String(rawText || "");
      var combined = bodyText.indexOf("Report Generated:") === 0 ? bodyText : (headerLine + bodyText);
      return prevRender.call(this, combined);
    };
    wrappedRender._dtWrapped = true;
    window.renderMd = wrappedRender;
  }
})();
</script>
